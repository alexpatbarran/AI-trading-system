# tradebot configuration
#
# SAFETY: mode defaults to "paper". Switching to "live" also requires the
# environment variable TRADEBOT_CONFIRM_LIVE=I_UNDERSTAND_THE_RISKS.

mode: paper          # paper | live
bar_minutes: 5       # intraday bar size used for features and decisions
db_path: data/tradebot.sqlite

markets:
  US:
    enabled: true
    broker: alpaca                # alpaca | ibkr | sim
    starting_capital: 10000       # sleeve size in local currency (USD)
    benchmark: SPY
    min_price: 5.0
    min_bar_dollar_volume: 250000 # avg traded value per bar, local currency
    holidays: []                  # YYYY-MM-DD; fill from the exchange calendar
    daily_universe_file: config/universe_us.txt
    broad_universe_file: config/universe_us_broad.txt   # created by `tradebot build-universe`
    universe: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD, AVGO, JPM,
               XOM, UNH, NFLX, COST, CRM, ORCL, INTC, BAC, WMT, PLTR]
    costs:                        # ASSUMPTIONS - check against your broker
      commission_per_share: 0.0
      commission_bps: 0.0
      min_commission: 0.0
      spread_bps: 2.0             # full quoted spread; half is paid per side
      slippage_bps: 3.0           # per side, on top of half-spread
      spread_tiers:               # daily track: [min avg daily $ volume, full spread bps]
        - [500000000, 2]          # mega caps
        - [100000000, 4]
        - [20000000, 10]
        - [5000000, 20]
        - [0, 40]                 # thinly traded small caps

  ASX:
    enabled: true
    broker: ibkr
    starting_capital: 10000       # AUD
    benchmark: STW
    min_price: 1.0
    min_bar_dollar_volume: 50000
    holidays: []
    universe: [BHP, CBA, CSL, NAB, WBC, ANZ, MQG, WES, FMG, RIO,
               WDS, TLS, WOW, GMG, TCL, ALL, QBE, STO, REA, XRO]
    costs:                        # ASSUMPTIONS - check IBKR's current ASX pricing
      commission_per_share: 0.0
      commission_bps: 8.0
      min_commission: 6.0
      spread_bps: 6.0
      slippage_bps: 5.0

strategy:
  name: momentum        # momentum (baseline) | ml
  horizon_bars: 6       # predict return over the next N bars (30 min at 5-min bars)
  train_days: 20        # walk-forward training window, in trading days
  min_train_days: 10    # don't trade until at least this much history exists
  retrain_every_days: 5
  min_train_samples: 500
  min_prob_up: 0.52

scanner:
  top_n: 10
  min_relative_volume: 1.2

risk:
  max_position_pct: 0.10        # of sleeve equity, per position
  max_positions: 5
  max_gross_exposure_pct: 0.60
  daily_loss_limit_pct: 0.02    # kill switch for the day
  stop_loss_pct: 0.01
  take_profit_pct: 0.02
  min_edge_bps: 5.0             # expected return minus round-trip costs must beat this
  no_new_entries_minutes_before_close: 30
  flatten_minutes_before_close: 10

daily:                  # swing trading on daily bars (tradebot ... --timeframe daily)
  horizon_days: 5       # predict open(t+1) -> close(t+5)
  train_days: 504       # ~2 years of history per model
  min_train_days: 252
  retrain_every_days: 21
  min_train_samples: 2000
  min_prob_up: 0.50
  max_positions: 10
  max_position_pct: 0.10
  max_gross_exposure_pct: 1.0
  stop_loss_pct: 0.08
  take_profit_pct: null
  min_edge_bps: 10.0
  min_dollar_volume: 1000000   # avg daily traded value; IEX volume understates this
  min_price: 5.0
  # size bands (--size large|mid|small) rank stocks by traded value each day:
  #   large = top 200, mid = 201-800, small = 801+

alpaca:
  feed: iex             # intraday feed: iex (free) | sip (paid for recent data)
  daily_feed: sip       # free plans can usually query older SIP data; falls back to iex

ibkr:
  host: 127.0.0.1
  port: 7497            # 7497 = TWS paper, 4002 = Gateway paper
  client_id: 17
